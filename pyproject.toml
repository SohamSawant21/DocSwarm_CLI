[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docswarm-cli"
version = "0.1.0"
description = "DocSwarm CLI for analyzing codebase architecture"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "pydot>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools]
packages = ["cli", "core", "graph", "models", "analyzers", "detectors"]
